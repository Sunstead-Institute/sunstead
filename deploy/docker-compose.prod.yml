services:
  hub:
    build:
      context: ..
      dockerfile: Dockerfile
    image: sunstead/hub:v0.1
    container_name: sunstead-hub
    restart: unless-stopped
    environment:
      - PORT=8080
      - RUST_LOG=sunstead_hub=info,tower_http=info
      - SUNSTEAD_PUBLIC_URL=https://sunstead.org
      - SUNSTEAD_MISSIONS_DIR=/app/missions
      - SUNSTEAD_DATA_DIR=/app/data
      - SUNSTEAD_WEB_DIR=/app/web
      - SUNSTEAD_MAX_CONCURRENT_VERIFIERS=${SUNSTEAD_MAX_CONCURRENT_VERIFIERS:-4}
      - SUNSTEAD_DOCKER_RUNTIME=${SUNSTEAD_DOCKER_RUNTIME:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sunstead-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    container_name: sunstead-caddy
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sunstead-data:
  caddy-data:
  caddy-config:
