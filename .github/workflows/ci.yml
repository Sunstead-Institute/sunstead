name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  hub:
    name: Hub (typecheck + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python:
    name: Python scripts compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile harness, verify scripts and tools
        run: |
          python3 -m py_compile \
            missions/verifier-common/sunstead_sandbox.py \
            missions/verifier-common/prebuild_cache.py \
            missions/verifier-common/prebuild_snapshot.py \
            cloudflare/containers/verifier_server.py \
            scripts/check-upstream.py scripts/check-statements.py scripts/redteam.py scripts/e2e.py \
            scripts/scout-upstream.py scripts/test_scout_upstream.py \
            scripts/export-upstream.py scripts/test_export_upstream.py \
            scripts/audit-live.py scripts/test_audit_live.py \
            scripts/test_bootstrap_snapshot.py
          for f in missions/*/verify; do python3 -m py_compile "$f"; done
      - name: Upstream scout unit tests (offline)
        run: python3 scripts/test_scout_upstream.py
      - name: Upstream export unit tests (offline, no Lean)
        run: python3 scripts/test_export_upstream.py
      - name: Repo-snapshot local bootstrap tests (offline)
        run: python3 scripts/test_bootstrap_snapshot.py -v
      - name: Independent audit unit tests (offline)
        run: python3 scripts/test_audit_live.py
      - name: Verify verbatim upstream provenance against pinned commits
        run: python3 scripts/check-upstream.py

  export-upstream:
    name: Upstream export (core Lean build)
    runs-on: ubuntu-latest
    needs: python
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install elan and the pinned Lean toolchain (core Lean only, no Mathlib)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --no-modify-path --default-toolchain "$(cat missions/pnt-analytic-foundations/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Export tests with lake build, sorry and axiom checks
        run: python3 scripts/test_export_upstream.py -v

  verifiers:
    name: Lean 4 verifier images (v4.36.0 + v4.35.0) + red-team suite
    runs-on: ubuntu-latest
    needs: python
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space for Lean 4.36 + Mathlib Docker build
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/julia* \
            /usr/share/swift
          docker system prune -af || true
          df -h /
      - name: Build Lean 4 verifier images (v4.36.0 + v4.35.0, runs SunsteadCheck selftest)
        run: ./scripts/build-verifiers.sh v4.36.0 v4.35.0
      - name: Red-team suite (v4.36.0 + v4.35.0 missions)
        run: python3 scripts/redteam.py --exclude-mission curve25519-dalek
      - name: Frozen task statements match the seed theorems (v4.36.0 + v4.35.0 missions)
        run: python3 scripts/check-statements.py --exclude-mission curve25519-dalek
      - name: Independent audit container security tests (v4.36.0 + v4.35.0 repo-snapshot)
        run: python3 scripts/test_audit_live.py -v

  verifiers-v431:
    name: Lean 4 verifier image (v4.31.0) + curve25519-dalek checks
    runs-on: ubuntu-latest
    needs: python
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space for Lean 4.31 + Mathlib + Aeneas Docker build
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/julia* \
            /usr/share/swift
          docker system prune -af || true
          df -h /
      - name: Build Lean 4.31.0 verifier image (runs SunsteadCheck selftest)
        run: ./scripts/build-verifiers.sh v4.31.0
      - name: Red-team suite (curve25519-dalek)
        run: python3 scripts/redteam.py --mission curve25519-dalek
      - name: Frozen task statements match the seed theorems (curve25519-dalek)
        run: python3 scripts/check-statements.py --mission curve25519-dalek
      - name: Independent audit container security tests (v4.31.0 repo-snapshot)
        run: python3 scripts/test_audit_live.py -v

  hub-images:
    name: Cloudflare container images (v4.36.0 + v4.35.0)
    runs-on: ubuntu-latest
    needs: python
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space for Lean 4.36 + Mathlib Docker build
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/julia* \
            /usr/share/swift
          docker system prune -af || true
          df -h /
      - name: Build Cloudflare Lean 4 verifier container images (v4.36.0 + v4.35.0)
        run: |
          docker build -t sunstead-verifier-lean4:ci -f cloudflare/containers/lean4/Dockerfile .
          docker build -t sunstead-verifier-lean4-v435:ci -f cloudflare/containers/lean4-v4.35.0/Dockerfile .
      - name: Verify bundled missions & server inside container images
        run: |
          docker run --rm --network=none sunstead-verifier-lean4:ci sh -c '
            test -d /missions/arklib-near-capacity-primes &&
            test -d /missions/pnt-analytic-foundations &&
            test -d /missions/onboarding-sandbox &&
            test -x /opt/sunstead/sunstead-check &&
            /opt/sunstead/sunstead-check selftest | grep -q "\"selftest\":\"ok\"" &&
            test "$(ls -1 /opt/sunstead/mission-cache | wc -l)" -ge 3 &&
            python3 -m py_compile /opt/verifier_server.py
          '
          docker run --rm --network=none sunstead-verifier-lean4-v435:ci sh -c '
            test -d /missions/lnsym-aes-gcm-armv8 &&
            test -d /missions/lnsym-gcm-gmult-armv8 &&
            test -x /opt/sunstead/sunstead-check &&
            /opt/sunstead/sunstead-check selftest | grep -q "\"selftest\":\"ok\"" &&
            test -f /opt/sunstead/snapshots/lnsym-aes-gcm-armv8/manifest.json &&
            test -f /opt/sunstead/snapshots/lnsym-gcm-gmult-armv8/manifest.json &&
            python3 -m py_compile /opt/verifier_server.py
          '

  hub-images-v431:
    name: Cloudflare container image (v4.31.0)
    runs-on: ubuntu-latest
    needs: python
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space for Lean 4.31 + Mathlib + Aeneas Docker build
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/julia* \
            /usr/share/swift
          docker system prune -af || true
          df -h /
      - name: Build Cloudflare Lean 4.31.0 verifier container image
        run: |
          docker build -t sunstead-verifier-lean4-v431:ci -f cloudflare/containers/lean4-v4.31.0/Dockerfile .
      - name: Verify bundled curve25519-dalek mission & server inside v4.31.0 container image
        run: |
          docker run --rm --network=none sunstead-verifier-lean4-v431:ci sh -c '
            test -d /missions/curve25519-dalek &&
            test -x /opt/sunstead/sunstead-check &&
            /opt/sunstead/sunstead-check selftest | grep -q "\"selftest\":\"ok\"" &&
            test -f /opt/sunstead/snapshots/curve25519-dalek/manifest.json &&
            test -f /opt/sunstead/snapshots/curve25519-dalek/frozen-sources/Curve25519Dalek/Math/Edwards/Representation.lean &&
            python3 -m py_compile /opt/verifier_server.py
          '
