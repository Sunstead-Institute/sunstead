name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  hub:
    name: Hub (typecheck + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python:
    name: Python scripts compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile harness, verify scripts and tools
        run: |
          python3 -m py_compile \
            missions/verifier-common/sunstead_sandbox.py \
            cloudflare/containers/verifier_server.py \
            scripts/check-upstream.py scripts/check-statements.py scripts/redteam.py scripts/e2e.py \
            scripts/scout-upstream.py scripts/test_scout_upstream.py
          for f in missions/*/verify; do python3 -m py_compile "$f"; done
      - name: Upstream scout unit tests (offline)
        run: python3 scripts/test_scout_upstream.py
      - name: Verify verbatim upstream provenance against pinned commits
        run: python3 scripts/check-upstream.py

  verifiers:
    name: Lean 4 verifier image + red-team suite
    runs-on: ubuntu-latest
    needs: python
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space for Lean 4.36 + Mathlib Docker build
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/julia* \
            /usr/share/swift
          docker system prune -af || true
          df -h /
      - name: Build Lean 4 verifier image (runs SunsteadCheck selftest)
        run: ./scripts/build-verifiers.sh
      - name: Red-team suite (every attack rejected, every honest control accepted)
        run: python3 scripts/redteam.py
      - name: Frozen task statements match the seed theorems (every mission, demos included)
        run: python3 scripts/check-statements.py

  hub-images:
    name: Cloudflare container image build
    runs-on: ubuntu-latest
    needs: python
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space for Lean 4.36 + Mathlib Docker build
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/julia* \
            /usr/share/swift
          docker system prune -af || true
          df -h /
      - name: Build Cloudflare Lean 4 verifier container image
        run: docker build -t sunstead-verifier-lean4:ci -f cloudflare/containers/lean4/Dockerfile .
      - name: Verify bundled missions & server inside container image
        run: |
          docker run --rm --network=none sunstead-verifier-lean4:ci sh -c '
            test -d /missions/arklib-near-capacity-primes &&
            test -d /missions/pnt-analytic-foundations &&
            test -d /missions/onboarding-sandbox &&
            python3 -m py_compile /opt/verifier_server.py
          '
