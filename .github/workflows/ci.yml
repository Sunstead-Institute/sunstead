name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hub:
    name: Hub (typecheck + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python:
    name: Python scripts compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile harness, verify scripts and tools
        run: |
          python3 -m py_compile \
            missions/verifier-common/sunstead_sandbox.py \
            cloudflare/containers/verifier_server.py \
            scripts/redteam.py scripts/e2e.py
          for f in missions/*/verify; do python3 -m py_compile "$f"; done

  verifiers:
    name: Lean 4 verifier image + red-team suite
    runs-on: ubuntu-latest
    needs: python
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build Lean 4 verifier image (runs SunsteadCheck selftest)
        run: ./scripts/build-verifiers.sh
      - name: Red-team suite (every attack rejected, every honest control accepted)
        run: python3 scripts/redteam.py

  hub-images:
    name: Cloudflare container image build
    runs-on: ubuntu-latest
    needs: python
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f cloudflare/containers/lean4/Dockerfile .
