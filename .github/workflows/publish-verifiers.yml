name: Publish Verifier Images (GHCR)

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Which Lean 4 verifier image(s) to build and push to GHCR"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - v4.36.0
          - v4.35.0
          - v4.31.0
  push:
    branches: [main]
    paths:
      - "missions/**"
      - ".github/workflows/publish-verifiers.yml"

concurrency:
  group: publish-verifiers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish GHCR · Lean ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: "v4.36.0"
            dockerfile: "missions/verifier-lean4/Dockerfile"
            image: "ghcr.io/sunstead-institute/verifier-lean4"
            tag: "v0.2"
          - toolchain: "v4.35.0"
            dockerfile: "missions/verifier-lean4-v4.35.0/Dockerfile"
            image: "ghcr.io/sunstead-institute/verifier-lean4-v4.35.0"
            tag: "v0.1"
          - toolchain: "v4.31.0"
            dockerfile: "missions/verifier-lean4-v4.31.0/Dockerfile"
            image: "ghcr.io/sunstead-institute/verifier-lean4-v4.31.0"
            tag: "v0.1"
    steps:
      - uses: actions/checkout@v4

      - name: Check whether target is selected and Dockerfile exists
        id: gate
        env:
          SELECTED: ${{ inputs.targets || 'all' }}
          TOOLCHAIN: ${{ matrix.toolchain }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          if [ "$SELECTED" != "all" ] && [ "$SELECTED" != "$TOOLCHAIN" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping $TOOLCHAIN (selected=$SELECTED)"
            exit 0
          fi
          if [ ! -f "$DOCKERFILE" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping $TOOLCHAIN ($DOCKERFILE not present on this branch yet)"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Free runner disk space for Lean + Mathlib Docker build
        if: steps.gate.outputs.run == 'true'
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/julia* \
            /usr/share/swift
          docker system prune -af || true
          df -h /

      - name: Log in to GitHub Container Registry (ghcr.io)
        if: steps.gate.outputs.run == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, selftest, and push verifier image to GHCR
        if: steps.gate.outputs.run == 'true'
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE: ${{ matrix.image }}
          TAG: ${{ matrix.tag }}
          TOOLCHAIN: ${{ matrix.toolchain }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          SHA_TAG="sha-${SHORT_SHA:0:12}"
          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/Sunstead-Institute/sunstead" \
            --label "org.opencontainers.image.description=Sunstead hermetic Lean 4 (${TOOLCHAIN}) kernel-replay verifier" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:${SHA_TAG}" \
            -f "${DOCKERFILE}" \
            missions

          # Verify the compiled native checker passes selftest offline before pushing.
          docker run --rm --network=none "${IMAGE}:${TAG}" \
            /opt/sunstead/sunstead-check selftest | grep -q '"selftest":"ok"'

          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:${SHA_TAG}"

          DIGEST_REF="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${TAG}")"
          echo "Published: ${DIGEST_REF}"
          {
            echo "### Published Lean ${TOOLCHAIN} Verifier"
            echo ""
            echo "- **Tag:** \`${IMAGE}:${TAG}\`"
            echo "- **Commit tag:** \`${IMAGE}:${SHA_TAG}\`"
            echo "- **Immutable digest:** \`${DIGEST_REF}\`"
            echo ""
            echo '```bash'
            echo "docker pull ${IMAGE}:${TAG}"
            echo "docker pull ${DIGEST_REF}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
