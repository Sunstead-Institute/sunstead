name: Audit published proofs

on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 1"

permissions:
  contents: read

concurrency:
  group: published-proof-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test audit plumbing and upstream provenance
        run: |
          python3 -m py_compile scripts/audit-live.py scripts/test_audit_live.py
          python3 -m unittest discover -s scripts -p 'test_audit_live.py'
          python3 scripts/check-upstream.py
      - name: Make disk headroom on the disposable hosted runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/share/powershell /usr/local/julia* /usr/share/swift
          docker system prune -af || true
          df -h /
      - name: Build pinned Lean toolchains (v4.36.0 + Mathlib and v4.35.0 repo-snapshot) from trusted checkout
        run: ./scripts/build-verifiers.sh
      - name: Verify audit spoofing resistance against v4.36.0 and v4.35.0 container images
        run: python3 -m unittest discover -s scripts -p 'test_audit_live.py' -v
      - name: Reproduce published proofs with stock Lean and leanchecker across toolchains
        run: python3 scripts/audit-live.py
