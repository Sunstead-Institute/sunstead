name: Deploy Production (sunstead.org)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Deploy mode (full rebuilds Lean 4 container; worker reuses live container digest)"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - worker
      rollout:
        description: "Cloudflare Containers rollout strategy"
        required: false
        default: "immediate"
        type: choice
        options:
          - immediate
          - gradual

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hub:
    name: Gate · Hub typecheck + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python:
    name: Gate · Python lint + upstream provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile harness, verify scripts and tools
        run: |
          python3 -m py_compile \
            missions/verifier-common/sunstead_sandbox.py \
            missions/verifier-common/prebuild_cache.py \
            missions/verifier-common/prebuild_snapshot.py \
            cloudflare/containers/verifier_server.py \
            cloudflare/containers/test_verifier_server.py \
            scripts/check-upstream.py scripts/check-statements.py scripts/test_check_statements.py scripts/redteam.py scripts/e2e.py \
            scripts/ci-path-gate.py scripts/test_ci_path_gate.py \
            scripts/check-best-known.py scripts/best_known/linear_floor.py
          for f in missions/*/verify; do python3 -m py_compile "$f"; done
      - name: Verifier server unit tests (offline)
        run: python3 cloudflare/containers/test_verifier_server.py -v
      - name: CI path gate unit tests (offline)
        run: python3 scripts/test_ci_path_gate.py -v
      - name: Statement-checker batching unit tests (offline)
        run: python3 scripts/test_check_statements.py -v
      - name: Verify verbatim upstream provenance against pinned commits
        run: python3 scripts/check-upstream.py
      - name: Every hill-climb task has a sourced best known value
        run: python3 scripts/check-best-known.py

  verifiers:
    name: Gate · Lean 4 verifiers (v4.36.0 + v4.35.0) + red-team + statements
    runs-on: ubuntu-latest
    needs: python
    if: ${{ inputs.mode != 'worker' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space for Lean 4.36 + Mathlib Docker build
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/julia* \
            /usr/share/swift
          docker system prune -af || true
          df -h /
      - name: Build Lean 4 verifier images (v4.36.0 + v4.35.0, runs SunsteadCheck selftest)
        run: ./scripts/build-verifiers.sh v4.36.0 v4.35.0
      - name: Red-team suite (v4.36.0 + v4.35.0)
        run: python3 scripts/redteam.py --exclude-mission curve25519-dalek --jobs 3
      - name: Frozen task statements match seed theorems (v4.36.0 + v4.35.0)
        run: python3 scripts/check-statements.py --exclude-mission curve25519-dalek --jobs 3

  verifiers-v431:
    name: Gate · Lean 4 verifier (v4.31.0) + curve25519-dalek
    runs-on: ubuntu-latest
    needs: python
    if: ${{ inputs.mode != 'worker' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space for Lean 4.31 + Mathlib + Aeneas Docker build
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/julia* \
            /usr/share/swift
          docker system prune -af || true
          df -h /
      - name: Build Lean 4.31.0 verifier image (runs SunsteadCheck selftest)
        run: ./scripts/build-verifiers.sh v4.31.0
      - name: Red-team suite (curve25519-dalek)
        run: python3 scripts/redteam.py --mission curve25519-dalek
      - name: Frozen task statements match seed theorems (curve25519-dalek)
        run: python3 scripts/check-statements.py --mission curve25519-dalek

  deploy:
    name: Deploy to Cloudflare (${{ inputs.mode || 'full' }})
    runs-on: ubuntu-latest
    needs: [hub, python, verifiers, verifiers-v431]
    if: >-
      ${{ !cancelled() &&
          needs.hub.result == 'success' &&
          needs.python.result == 'success' &&
          ((needs.verifiers.result == 'success' && needs.verifiers-v431.result == 'success') ||
           (inputs.mode == 'worker' && needs.verifiers.result == 'skipped' && needs.verifiers-v431.result == 'skipped')) }}
    timeout-minutes: 60
    steps:
      - name: Check required Cloudflare secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN (see docs/DEPLOYMENT.md)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Free runner disk space for native x86_64 Lean 4.36 + Mathlib container build
        if: ${{ inputs.mode != 'worker' }}
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/julia* \
            /usr/share/swift
          docker system prune -af || true
          df -h /
      - name: Install Cloudflare workspace dependencies
        working-directory: cloudflare
        run: npm ci
      - name: Sync assets and deploy to Cloudflare
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_MODE: ${{ inputs.mode || 'full' }}
          ROLLOUT: ${{ inputs.rollout || 'immediate' }}
        run: |
          if [ "$DEPLOY_MODE" = "worker" ]; then
            # Caller explicitly opted into worker-only mode on a fresh CI runner.
            node scripts/deploy.mjs worker --force --containers-rollout "$ROLLOUT"
          else
            node scripts/deploy.mjs full --containers-rollout "$ROLLOUT"
          fi
      - name: Post-deploy read-only smoke checks
        run: |
          curl -fsSL https://sunstead.org/ >/dev/null
          curl -fsSL https://sunstead.org/what-is-this >/dev/null
          curl -fsSL https://sunstead.org/join.txt | grep -q "leanprover/lean4:v4.36.0"
          curl -fsSL https://sunstead.org/api/health | grep -q '"ok":true'
          curl -fsSL https://sunstead.org/api/missions | grep -q '"arklib-near-capacity-primes"'
